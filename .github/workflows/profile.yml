name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '37 19 * * *' # 04:37 KST / 19:37 UTC

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'jihyungkim0011/jihyungkim0011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate public GitHub statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=jihyungkim0011&show_icons=false&hide_rank=true&include_all_commits=false&bg_color=f6f8fa&title_color=24292f&text_color=59636e&icon_color=59636e&border_color=d1d9e0&border_radius=6&disable_animations=true
          path: profile/stats.svg
          token: ${{ github.token }}
          fail_on_error: 'true'

      - name: Generate public contribution landscape
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: jihyungkim0011

      - name: Validate generated SVGs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = ['profile/stats.svg', 'profile-3d-contrib/profile-night-rainbow.svg']
          for name in paths:
              data = Path(name).read_text()
              root = ET.fromstring(data)
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
              assert 'PENDING GENERATION' not in data and 'PLACEHOLDER' not in data, name
              assert 'Something went wrong' not in data, name
          PY

      - name: Commit only the two generated cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile/stats.svg profile-3d-contrib/profile-night-rainbow.svg
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'chore: refresh profile visuals'
          git push
